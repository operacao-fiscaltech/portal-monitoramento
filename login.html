<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fiscaltech — Login</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=IBM+Plex+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f0f4f8;--surface:#fff;--border:#dde3ed;
  --accent:#0066cc;--accent2:#0052a3;--header:#0052a3;--header2:#003d7a;
  --green:#059669;--red:#dc2626;--yellow:#d97706;
  --text:#0f1b2d;--muted:#6b7280;--muted2:#9ca3af;
  --display:'Plus Jakarta Sans',sans-serif;
  --mono:'IBM Plex Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);font-family:var(--display)}

/* ── BACKGROUND ── */
body{
  display:flex;align-items:center;justify-content:center;min-height:100vh;
  background:linear-gradient(135deg,var(--header2) 0%,var(--header) 55%,#1d6fa8 100%);
  position:relative;overflow:hidden;
}
body::before{
  content:'';position:absolute;inset:0;
  background-image:
    radial-gradient(circle at 20% 80%,rgba(255,255,255,.04) 0%,transparent 50%),
    radial-gradient(circle at 80% 20%,rgba(255,255,255,.05) 0%,transparent 50%),
    repeating-linear-gradient(45deg,transparent,transparent 60px,rgba(255,255,255,.012) 60px,rgba(255,255,255,.012) 61px);
  pointer-events:none;
}

/* ── CARD ── */
.login-card{
  background:#fff;border-radius:20px;padding:44px 40px 40px;
  width:100%;max-width:420px;position:relative;z-index:1;
  box-shadow:0 24px 64px rgba(0,0,0,.22),0 4px 16px rgba(0,0,0,.12);
}

.card-logo{display:flex;align-items:center;gap:13px;margin-bottom:32px}
.logo-box{
  width:46px;height:46px;background:var(--header);border-radius:12px;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  box-shadow:0 3px 10px rgba(0,82,163,.3);
}
.logo-box svg{width:34px;height:22px}
.logo-text{font-size:21px;font-weight:800;color:var(--text);letter-spacing:.04em}
.logo-text span{color:var(--accent);font-weight:300}
.logo-sub{font-family:var(--mono);font-size:9px;color:var(--muted2);text-transform:uppercase;letter-spacing:.1em;margin-top:2px}

.card-title{font-size:17px;font-weight:700;color:var(--text);margin-bottom:6px}
.card-sub{font-size:12px;color:var(--muted);margin-bottom:28px;line-height:1.5}

/* ── FORM ── */
.field{margin-bottom:16px}
.field label{
  display:block;font-family:var(--mono);font-size:10px;font-weight:500;
  text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:7px;
}
.field input{
  width:100%;padding:11px 14px;border:1.5px solid var(--border);border-radius:10px;
  font-family:var(--display);font-size:14px;color:var(--text);
  background:var(--bg);outline:none;transition:.15s;
}
.field input:focus{border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px rgba(0,102,204,.1)}
.field input::placeholder{color:var(--muted2)}

.btn-login{
  width:100%;padding:13px;background:var(--accent2);color:#fff;
  border:none;border-radius:10px;font-family:var(--display);font-size:14px;
  font-weight:700;cursor:pointer;transition:.15s;margin-top:8px;letter-spacing:.02em;
}
.btn-login:hover{background:var(--header2);transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,52,103,.25)}
.btn-login:active{transform:none}
.btn-login:disabled{opacity:.6;cursor:not-allowed;transform:none}

/* ── ALERTA ── */
.alerta{
  display:none;padding:10px 14px;border-radius:8px;font-size:12px;font-weight:600;
  margin-bottom:16px;align-items:center;gap:8px;
}
.alerta.erro{background:#fef2f2;color:var(--red);border:1px solid #fecaca}
.alerta.ok{background:#ecfdf5;color:var(--green);border:1px solid #a7f3d0}
.alerta.show{display:flex}

/* ── NIVEL BADGES ── */
.nivel-strip{
  display:flex;gap:6px;margin-top:20px;padding-top:20px;
  border-top:1px solid var(--border);flex-wrap:wrap;
}
.nivel-badge{
  font-family:var(--mono);font-size:9px;font-weight:700;
  padding:3px 8px;border-radius:4px;text-transform:uppercase;letter-spacing:.07em;
}
.nb-adm-sis{background:#f5f3ff;color:#7c3aed;border:1px solid #ddd6fe}
.nb-adm    {background:#eff6ff;color:#0066cc;border:1px solid #bfdbfe}
.nb-analista{background:#ecfdf5;color:#059669;border:1px solid #a7f3d0}

.footer-txt{
  text-align:center;font-family:var(--mono);font-size:10px;color:var(--muted2);
  margin-top:22px;
}
</style>
</head>
<body>
<div class="login-card">

  <div class="card-logo">
    <div class="logo-box">
      <svg viewBox="0 0 80 50" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M5 35 L20 15 L28 22 L38 8 L55 28" stroke="white" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <rect x="5" y="38" width="70" height="4" rx="2" fill="white"/>
        <path d="M38 8 L55 28 L68 18" stroke="rgba(255,255,255,.65)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </svg>
    </div>
    <div>
      <div class="logo-text">FISCAL<span>TECH</span></div>
      <div class="logo-sub">Tecnologia a Favor da Vida</div>
    </div>
  </div>

  <div class="card-title">Acesso ao Portal</div>
  <div class="card-sub">Faça login para acessar o monitoramento de contratos.</div>

  <div class="alerta erro" id="alertaErro">
    <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><circle cx="7" cy="7" r="6" stroke="currentColor" stroke-width="1.5"/><path d="M7 4v3.5M7 9.5v.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
    <span id="alertaErroTxt">Usuário ou senha inválidos.</span>
  </div>

  <div class="field">
    <label>Usuário</label>
    <input type="text" id="inputUser" placeholder="seu.usuario" autocomplete="username" spellcheck="false">
  </div>
  <div class="field">
    <label>Senha</label>
    <input type="password" id="inputSenha" placeholder="••••••••" autocomplete="current-password">
  </div>

  <button class="btn-login" id="btnLogin" onclick="fazerLogin()">Entrar</button>

  <div class="nivel-strip">
    <span class="nivel-badge nb-adm-sis">ADM SIS</span>
    <span class="nivel-badge nb-adm">ADM</span>
    <span class="nivel-badge nb-analista">ANALISTA</span>
  </div>

  <div class="footer-txt">Fiscaltech Portal v2.1 — Acesso restrito</div>
</div>

<script>
// ── AGENT_URL — injetado automaticamente pelo agente ao iniciar ──
const AGENT_URL = "http://localhost:5001";

// ── USUÁRIOS — atualizado automaticamente pelo configurador ──
const USUARIOS = {
  "admin": {
    hash: "8c6976e5b5410415bde908bd4dee15dfb167a9c873fc4bb8a81f6f2ab448a918",
    nivel: "adm_sis",
    criadoPor: "sistema"
  }
};

// ──────────────────────────────────────────────────────────────
// Detecta se está sendo servido pelo agente (/app/) ou GitHub Pages
// e retorna o caminho correto para o portal
function _urlPortal() {
  return window.location.pathname.startsWith('/app')
    ? '/app/portal'
    : 'portal.html';
}

const SESSION_KEY = 'ft_session';

// SHA-256 puro em JS — funciona em HTTP e HTTPS (não depende de crypto.subtle)
function sha256(str){
  function rr32(v,n){return(v>>>n)|(v<<(32-n))}
  function safe_add(x,y){var lsw=(x&0xFFFF)+(y&0xFFFF),msw=(x>>16)+(y>>16)+(lsw>>16);return(msw<<16)|(lsw&0xFFFF)}
  var K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
         0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
         0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
         0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
         0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
         0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
         0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
         0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  var utf8=unescape(encodeURIComponent(str));
  var msg=[];
  for(var i=0;i<utf8.length;i++) msg.push(utf8.charCodeAt(i));
  msg.push(0x80);
  while(msg.length%64!==56) msg.push(0);
  var len=utf8.length*8;
  msg.push(0,0,0,0,(len>>>24)&0xff,(len>>>16)&0xff,(len>>>8)&0xff,len&0xff);
  var h0=0x6a09e667,h1=0xbb67ae85,h2=0x3c6ef372,h3=0xa54ff53a;
  var h4=0x510e527f,h5=0x9b05688c,h6=0x1f83d9ab,h7=0x5be0cd19;
  for(var blk=0;blk<msg.length;blk+=64){
    var w=[];
    for(var t=0;t<16;t++) w[t]=(msg[blk+t*4]<<24)|(msg[blk+t*4+1]<<16)|(msg[blk+t*4+2]<<8)|msg[blk+t*4+3];
    for(var t=16;t<64;t++){var s0=rr32(w[t-15],7)^rr32(w[t-15],18)^(w[t-15]>>>3);var s1=rr32(w[t-2],17)^rr32(w[t-2],19)^(w[t-2]>>>10);w[t]=safe_add(safe_add(safe_add(w[t-16],s0),w[t-7]),s1)}
    var a=h0,b=h1,c=h2,d=h3,e=h4,f=h5,g=h6,h=h7;
    for(var t=0;t<64;t++){
      var S1=rr32(e,6)^rr32(e,11)^rr32(e,25);
      var ch=(e&f)^(~e&g);
      var tmp1=safe_add(safe_add(safe_add(safe_add(h,S1),ch),K[t]),w[t]);
      var S0=rr32(a,2)^rr32(a,13)^rr32(a,22);
      var maj=(a&b)^(a&c)^(b&c);
      var tmp2=safe_add(S0,maj);
      h=g;g=f;f=e;e=safe_add(d,tmp1);d=c;c=b;b=a;a=safe_add(tmp1,tmp2);
    }
    h0=safe_add(h0,a);h1=safe_add(h1,b);h2=safe_add(h2,c);h3=safe_add(h3,d);
    h4=safe_add(h4,e);h5=safe_add(h5,f);h6=safe_add(h6,g);h7=safe_add(h7,h);
  }
  var hex=[h0,h1,h2,h3,h4,h5,h6,h7].map(function(n){return('00000000'+((n>>>0).toString(16))).slice(-8)}).join('');
  return Promise.resolve(hex);
}

async function fazerLogin(){
  const btn   = document.getElementById('btnLogin');
  const user  = document.getElementById('inputUser').value.trim();
  const senha = document.getElementById('inputSenha').value;
  const alerta = document.getElementById('alertaErro');

  alerta.classList.remove('show');

  if(!user || !senha){
    mostrarErro('Preencha usuário e senha.');
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Verificando…';

  try {
    const h = await sha256(senha);
    const ud = USUARIOS[user];

    if(!ud || ud.hash !== h){
      mostrarErro('Usuário ou senha inválidos.');
      btn.disabled = false;
      btn.textContent = 'Entrar';
      return;
    }

    // Salva sessão com hash incluído para autenticação automática no agente
    const sessao = { user, nivel: ud.nivel, h };
    sessionStorage.setItem(SESSION_KEY, JSON.stringify(sessao));

    btn.textContent = '✓ Acessando…';
    window.location.href = _urlPortal();

  } catch(e) {
    mostrarErro('Erro ao processar login. Tente novamente.');
    btn.disabled = false;
    btn.textContent = 'Entrar';
  }
}

function mostrarErro(txt){
  document.getElementById('alertaErroTxt').textContent = txt;
  document.getElementById('alertaErro').classList.add('show');
}

// Enter para submeter
document.addEventListener('keydown', e => {
  if(e.key === 'Enter') fazerLogin();
});

// Se já tem sessão válida, vai direto para o portal
try {
  const s = JSON.parse(sessionStorage.getItem(SESSION_KEY));
  if(s && s.user && s.nivel) window.location.href = _urlPortal();
} catch(e){}
</script>
</body>
</html>
