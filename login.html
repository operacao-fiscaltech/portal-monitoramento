<!DOCTYPE html>
<html lang="pt-BR">

<title>Fiscaltech — Login</title>

<style>
:root{
  --header:#0052a3;--header2:#003d7a;--accent:#0066cc;--accent2:#0052a3;
  --text:#0f1b2d;--muted:#6b7280;--muted2:#9ca3af;--border:#dde3ed;--bg:#f0f4f8;
  --red:#dc2626;--display:'Plus Jakarta Sans',sans-serif;--mono:'IBM Plex Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{display:flex;align-items:center;justify-content:center;min-height:100vh;
  background:linear-gradient(135deg,var(--header2) 0%,var(--header) 55%,#1d6fa8 100%);
  font-family:var(--display)}
.card{background:#fff;border-radius:20px;padding:44px 40px 40px;width:100%;max-width:420px;
  box-shadow:0 24px 64px rgba(0,0,0,.22)}
.logo{display:flex;align-items:center;gap:13px;margin-bottom:32px}
.logo-box{width:46px;height:46px;background:var(--header);border-radius:12px;
  display:flex;align-items:center;justify-content:center}
.logo-txt{font-size:21px;font-weight:800;color:var(--text);letter-spacing:.04em}
.logo-txt span{color:var(--accent);font-weight:300}
.logo-sub{font-family:var(--mono);font-size:9px;color:var(--muted2);text-transform:uppercase;letter-spacing:.1em;margin-top:2px}
h2{font-size:17px;font-weight:700;color:var(--text);margin-bottom:6px}
.sub{font-size:12px;color:var(--muted);margin-bottom:28px;line-height:1.5}
.field{margin-bottom:16px}
.field label{display:block;font-family:var(--mono);font-size:10px;font-weight:500;
  text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:7px}
.field input{width:100%;padding:11px 14px;border:1.5px solid var(--border);border-radius:10px;
  font-family:var(--display);font-size:14px;color:var(--text);background:var(--bg);outline:none;transition:.15s}
.field input:focus{border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px rgba(0,102,204,.1)}
.field input::placeholder{color:var(--muted2)}
.btn{width:100%;padding:13px;background:var(--accent2);color:#fff;border:none;
  border-radius:10px;font-family:var(--display);font-size:14px;font-weight:700;cursor:pointer;transition:.15s;margin-top:8px}
.btn:hover{background:var(--header2)}
.btn:disabled{opacity:.6;cursor:not-allowed}
.alert{display:none;padding:10px 14px;border-radius:8px;font-size:12px;font-weight:600;
  margin-bottom:16px;align-items:center;gap:8px;background:#fef2f2;color:var(--red);border:1px solid #fecaca}
.alert.show{display:flex}
.badges{display:flex;gap:6px;margin-top:20px;padding-top:20px;border-top:1px solid var(--border)}
.badge{font-family:var(--mono);font-size:9px;font-weight:700;padding:3px 8px;border-radius:4px}
.b1{background:#f5f3ff;color:#7c3aed}.b2{background:#eff6ff;color:#0066cc}.b3{background:#ecfdf5;color:#059669}
.footer{text-align:center;font-family:var(--mono);font-size:10px;color:var(--muted2);margin-top:22px}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-box">
      <svg width="34" height="22" viewBox="0 0 80 50" fill="none">
        <path d="M5 35 L20 15 L28 22 L38 8 L55 28" stroke="white" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <rect x="5" y="38" width="70" height="4" rx="2" fill="white"/>
        <path d="M38 8 L55 28 L68 18" stroke="rgba(255,255,255,.65)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </svg>
    </div>
    <div>
      <div class="logo-txt">FISCAL<span>TECH</span></div>
      <div class="logo-sub">Tecnologia a Favor da Vida</div>
    </div>
  </div>
  <h2>Acesso ao Portal</h2>
  <p class="sub">Faça login para acessar o monitoramento de contratos.</p>
  <div class="alert" id="alerta"><span>⚠</span><span id="alertaTxt">Usuário ou senha inválidos.</span></div>
  <div class="field"><label>Usuário</label><input type="text" id="iUser" placeholder="seu.usuario" autocomplete="username" spellcheck="false"></div>
  <div class="field"><label>Senha</label><input type="password" id="iSenha" placeholder="••••••••" autocomplete="current-password"></div>
  <button class="btn" id="btnLogin" onclick="fazerLogin()">Entrar</button>
  <div class="badges">
    <span class="badge b1">ADM SIS</span>
    <span class="badge b2">ADM</span>
    <span class="badge b3">ANALISTA</span>
  </div>
  <div class="footer">Fiscaltech Portal v2.1 — Acesso restrito</div>
</div>

<script>
// AGENT_URL: substituído automaticamente pelo agente ao servir este arquivo.
// Usar "var" para evitar conflito de redeclaração se o arquivo for carregado novamente.

};

// SHA-256 puro em JS (sem crypto.subtle — funciona em HTTP simples)
function sha256(str) {
  function rr(v,n){return(v>>>n)|(v<<(32-n))}
  function add(x,y){var l=(x&0xFFFF)+(y&0xFFFF),m=(x>>16)+(y>>16)+(l>>16);return(m<<16)|(l&0xFFFF)}
  var K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
    0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
    0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
    0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
    0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
    0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
    0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
    0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  var u=unescape(encodeURIComponent(str)),msg=[];
  for(var i=0;i<u.length;i++)msg.push(u.charCodeAt(i));
  msg.push(0x80);
  while(msg.length%64!==56)msg.push(0);
  var len=u.length*8;
  msg.push(0,0,0,0,(len>>>24)&0xff,(len>>>16)&0xff,(len>>>8)&0xff,len&0xff);
  var h0=0x6a09e667,h1=0xbb67ae85,h2=0x3c6ef372,h3=0xa54ff53a,
      h4=0x510e527f,h5=0x9b05688c,h6=0x1f83d9ab,h7=0x5be0cd19;
  for(var blk=0;blk<msg.length;blk+=64){
    var w=[];
    for(var t=0;t<16;t++)w[t]=(msg[blk+t*4]<<24)|(msg[blk+t*4+1]<<16)|(msg[blk+t*4+2]<<8)|msg[blk+t*4+3];
    for(var t=16;t<64;t++){
      var s0=rr(w[t-15],7)^rr(w[t-15],18)^(w[t-15]>>>3);
      var s1=rr(w[t-2],17)^rr(w[t-2],19)^(w[t-2]>>>10);
      w[t]=add(add(add(w[t-16],s0),w[t-7]),s1);
    }
    var a=h0,b=h1,c=h2,d=h3,e=h4,f=h5,g=h6,h=h7;
    for(var t=0;t<64;t++){
      var S1=rr(e,6)^rr(e,11)^rr(e,25),ch=(e&f)^(~e&g);
      var t1=add(add(add(add(h,S1),ch),K[t]),w[t]);
      var S0=rr(a,2)^rr(a,13)^rr(a,22),mj=(a&b)^(a&c)^(b&c);
      var t2=add(S0,mj);
      h=g;g=f;f=e;e=add(d,t1);d=c;c=b;b=a;a=add(t1,t2);
    }
    h0=add(h0,a);h1=add(h1,b);h2=add(h2,c);h3=add(h3,d);
    h4=add(h4,e);h5=add(h5,f);h6=add(h6,g);h7=add(h7,h);
  }
  return [h0,h1,h2,h3,h4,h5,h6,h7].map(function(n){
    return('00000000'+((n>>>0).toString(16))).slice(-8);
  }).join('');
}

// Constantes de sessão
var SESSION_KEY    = 'ft_session';
var AGENT_TK_KEY  = 'ft_agent_token';

// Detecta contexto: agente (porta 5001) ou GitHub Pages
function _isAgent() {
  return window.location.protocol === 'http:' && window.location.port === '5001';
}
function urlPortal() {
  return _isAgent() ? '/app/portal' : 'portal.html';
}

async function fazerLogin() {
  var btn   = document.getElementById('btnLogin');
  var user  = document.getElementById('iUser').value.trim();
  var senha = document.getElementById('iSenha').value;
  document.getElementById('alerta').classList.remove('show');

  if (!user || !senha) { mostrarErro('Preencha usuário e senha.'); return; }

  btn.disabled = true;
  btn.textContent = 'Verificando…';

  try {
    var h  = sha256(senha);
    var ud = USUARIOS[user];

    // 1. Verifica contra USUARIOS local (sempre disponível)
    if (ud && ud.hash === h) {
      var sessao = { user: user, nivel: ud.nivel, h: h };
      sessionStorage.setItem(SESSION_KEY, JSON.stringify(sessao));
      // Tenta obter token do agente em background (não bloqueia)
      _tentarTokenAgente(user, h);
      window.location.href = urlPortal();
      return;
    }

    // 2. Se servido pelo agente, tenta validar no servidor (usuários criados pelo configurador)
    if (_isAgent()) {
      try {
        var r = await fetch(AGENT_URL + '/auth', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ user: user, hash: h })
        });
        if (r.ok) {
          var d = await r.json();
          if (d.token) {
            var sessao = { user: user, nivel: d.nivel, h: h };
            sessionStorage.setItem(SESSION_KEY, JSON.stringify(sessao));
            localStorage.setItem(AGENT_TK_KEY, d.token);
            window.location.href = urlPortal();
            return;
          }
        }
      } catch (e) {}
    }

    mostrarErro('Usuário ou senha inválidos.');
  } catch(e) {
    mostrarErro('Erro inesperado. Tente novamente.');
  }

  btn.disabled = false;
  btn.textContent = 'Entrar';
}

function _tentarTokenAgente(user, h) {
  if (!_isAgent()) return;
  fetch(AGENT_URL + '/auth', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ user: user, hash: h })
  }).then(function(r) {
    if (r.ok) return r.json();
  }).then(function(d) {
    if (d && d.token) localStorage.setItem(AGENT_TK_KEY, d.token);
  }).catch(function() {});
}

function mostrarErro(txt) {
  document.getElementById('alertaTxt').textContent = txt;
  document.getElementById('alerta').classList.add('show');
}

document.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') fazerLogin();
});

// Se já tem sessão válida, redireciona direto
try {
  var s = JSON.parse(sessionStorage.getItem(SESSION_KEY));
  if (s && s.user && s.nivel) window.location.href = urlPortal();
} catch(e) {}
</script>
